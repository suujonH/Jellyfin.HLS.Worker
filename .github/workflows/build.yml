name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The jellyfin server the TrueCache tool is published from; keep it on the server release this worker pairs with.
  JELLYFIN_REPOSITORY: suujonH/jellyfin
  JELLYFIN_REF: v13.0.0-hls.1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The engine tests encode real media and are skipped without ffmpeg and ffprobe on the PATH.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Test
        run: dotnet test -c Release

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: worker

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.JELLYFIN_REPOSITORY }}
          ref: ${{ env.JELLYFIN_REF }}
          path: jellyfin

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dotnet msbuild worker/src/Jellyfin.Hls.Worker/Jellyfin.Hls.Worker.csproj -getProperty:Version | tr -d '\r\n ')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 Directory.Build.props 中的版本 $version 不一致"
            exit 1
          fi

      # Linux packages are archived here, so they keep the modes the script sets.
      - name: Publish
        run: sh worker/scripts/publish.sh jellyfin

      # An artifact is always downloaded as a zip: the Windows package goes in as its folder, so the zip holds the
      # executables directly; the Linux packages go in as their tar.gz, which keeps the executable modes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-hls-worker-win-x64
          path: worker/artifacts/jellyfin-hls-worker-*-win-x64/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-hls-worker-linux-x64
          path: worker/artifacts/jellyfin-hls-worker-*-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfin-hls-worker-linux-arm64
          path: worker/artifacts/jellyfin-hls-worker-*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd worker/artifacts
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber ./*.zip ./*.tar.gz
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease --generate-notes \
              --title "Jellyfin HLS Worker ${GITHUB_REF_NAME#v}" ./*.zip ./*.tar.gz
          fi
